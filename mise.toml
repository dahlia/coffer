min_version = "2026.9.1"

[settings]
experimental = true

[tools]
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:dahlia/hongdown" = "0.5.3"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.0"

[tools.rust]
version = "1.98.0"
profile = "default"
components = "rust-analyzer,rustfmt,clippy"

# Formatting ------------------------------------------------------------------

[tasks.fmt]
description = "Format all project-owned source and documentation"
run = ["cargo fmt --all", "hongdown --write", "mise fmt"]

[tasks.fmt-check]
description = "Verify formatting without modifying the working tree"
run = ["cargo fmt --all --check", "hongdown --check", "mise fmt --check"]

# Static verification ---------------------------------------------------------

# Clippy runs the full rustc front end, so it subsumes `cargo check`.  Running
# both would compile every workspace crate twice per gate.  `-D warnings` on the
# command line backs up ordinary warnings and Clippy's `all` group for a crate
# that forgets `[lints] workspace = true`; the allow-by-default lints in
# Cargo.toml (missing docs, unsafe code, undocumented unsafe blocks) reach a
# crate only through that inherit line, so check it in every new manifest.
[tasks.clippy]
description = "Type-check and lint every workspace target with Clippy"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.lint-actions]
description = "Lint GitHub Actions workflows"
# Disable opportunistic host tools so actionlint behaves identically everywhere.
run = [
  "actionlint -shellcheck= -pyflakes=",
  "zizmor --offline .github/workflows",
]

[tasks.check-omnisette]
description = "Verify the local-only anisette graph and vendored provenance"
wait_for = ["clippy"]
run = "cargo run --quiet --locked --offline -p coffer-omnisette-check"

[tasks.check-oo7]
description = "Verify the complete vendored oo7 tree and patch provenance"
wait_for = ["clippy"]
run = "cargo run --quiet --locked --offline -p coffer-oo7-check"

[tasks.verify-omnisette-upstream]
description = "Reproduce the vendored omnisette subtree from pinned upstream"
# This explicit maintainer check fetches the immutable upstream commit. It is
# intentionally outside `check` and `ci`, which must retain their existing
# offline source/provenance verification behavior.
run = "bash tools/import-omnisette-local.sh"

[tasks.check]
description = "Fast static verification for frequent use and pre-commit hooks"
depends = [
  "fmt-check",
  "clippy",
  "lint-actions",
  "check-omnisette",
  "check-oo7",
]

# Build, test, and documentation ----------------------------------------------

# `wait_for` serializes the cargo tasks only when they are already scheduled
# together (for example under `mise run ci`) so that they do not contend for the
# target directory lock.  Unlike `depends`, it does not pull Clippy into a plain
# `mise run test`.
[tasks.build]
description = "Build every workspace target"
wait_for = ["clippy"]
run = "cargo build --workspace --all-targets --locked"

[tasks.test]
description = "Run the workspace test suite, including doctests"
wait_for = ["build"]
run = "cargo test --workspace --locked"

[tasks.doc]
description = "Build Rust API documentation with warnings denied"
wait_for = ["test"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

# Live Apple Account harness --------------------------------------------------

# Interactive and developer-only.  It performs one live Apple Account
# authentication against gsa.apple.com, may download the Apple support
# libraries and provision local anisette, and writes one item to the desktop
# Secret Service.  It reads the account name, password, and verification code
# from the controlling terminal only; nothing passes through the shell.  It is
# deliberately absent from `check`, `test`, and `ci`.  The helper executable is
# built in the same graph first so the harness can locate it beside itself.
[tasks.test-live-auth]
description = "Run the interactive live Apple Account authentication harness"
run = [
  "cargo build --locked -p coffer-anisette -p coffer-live-auth --bin coffer-anisette-helper --bin coffer-live-auth",
  "cargo run --quiet --locked -p coffer-live-auth --bin coffer-live-auth",
]

# Dependency audit ------------------------------------------------------------

# The policy lives in deny.toml.  This task is part of the gate but not of
# `check`: the advisories check clones the RustSec advisory database, so it
# needs the network and is not fast static verification.  `--locked` makes
# cargo-deny refuse to touch Cargo.lock, matching every other cargo task here.
[tasks.deny]
description = "Audit dependency advisories, licenses, bans, and sources"
run = "cargo-deny --locked check"

# The gate --------------------------------------------------------------------

[tasks.ci]
description = "Complete verification gate; must match continuous integration"
depends = ["check", "build", "test", "doc", "deny"]
